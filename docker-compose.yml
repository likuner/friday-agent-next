services:
  postgres:
    image: postgres:16-alpine
    container_name: friday-agent-next-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: friday_agent
      POSTGRES_USER: friday
      POSTGRES_PASSWORD: friday
    ports:
      # 5432 已被原 friday-agent 的 postgres 占用，本项目独立用 5433
      - "5433:5432"
    volumes:
      - friday_agent_next_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday -d friday_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  friday_agent_next_pgdata:
